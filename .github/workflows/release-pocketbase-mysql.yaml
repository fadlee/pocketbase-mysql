name: release-pocketbase-mysql

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_suffix: ''
            native: true
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary_suffix: ''
            native: false
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary_suffix: ''
            native: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_suffix: ''
            native: true
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_suffix: '.exe'
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=25.2.1'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'

      - name: Build Admin dashboard UI
        run: npm --prefix=./ui ci && npm --prefix=./ui run build

      - name: Build pocketbase-mysql
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -ldflags "-X github.com/pocketbase/pocketbase.Version=${VERSION}" -o pocketbase-mysql${{ matrix.binary_suffix }} ./examples/base

      - name: Validate embedded UI (Unix)
        if: runner.os != 'Windows' && matrix.native == true
        shell: bash
        run: |
          ./pocketbase-mysql${{ matrix.binary_suffix }} serve --http 127.0.0.1:18090 > pb.log 2>&1 &
          pb_pid=$!
          trap 'kill "$pb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18090/_/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat pb.log
          exit 1

      - name: Validate embedded UI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\pocketbase-mysql${{ matrix.binary_suffix }}" -ArgumentList "serve","--http","127.0.0.1:18090" -PassThru -NoNewWindow -RedirectStandardOutput pb.log -RedirectStandardError pb.err.log
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18090/_/ | Out-Null
                exit 0
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            Get-Content pb.log -ErrorAction SilentlyContinue
            Get-Content pb.err.log -ErrorAction SilentlyContinue
            exit 1
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package release asset
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive_name="pocketbase-mysql_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          # rename binary to expected name (pocketbase-mysql or pocketbase-mysql.exe)
          # then bundle into a zip alongside CHANGELOG.md and LICENSE.md if present
          extra_files=()
          [ -f CHANGELOG.md ] && extra_files+=(CHANGELOG.md)
          [ -f LICENSE.md ] && extra_files+=(LICENSE.md)
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a -tzip "$archive_name" "pocketbase-mysql${{ matrix.binary_suffix }}" "${extra_files[@]}"
          else
            zip -j "$archive_name" "pocketbase-mysql${{ matrix.binary_suffix }}" "${extra_files[@]}"
          fi
          echo "ASSET_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
