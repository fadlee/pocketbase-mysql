name: build-pocketbase-mysql

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_suffix: ''
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary_suffix: ''
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary_suffix: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_suffix: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=25.2.1'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'

      - name: Build Admin dashboard UI
        run: npm --prefix=./ui ci && npm --prefix=./ui run build

      - name: Build pocketbase-mysql
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o pocketbase-mysql${{ matrix.binary_suffix }} ./examples/base

      - name: Validate embedded UI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./pocketbase-mysql${{ matrix.binary_suffix }} serve --http 127.0.0.1:18090 > pb.log 2>&1 &
          pb_pid=$!
          trap 'kill "$pb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18090/_/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat pb.log
          exit 1

      - name: Validate embedded UI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\pocketbase-mysql${{ matrix.binary_suffix }}" -ArgumentList "serve","--http","127.0.0.1:18090" -PassThru -NoNewWindow -RedirectStandardOutput pb.log -RedirectStandardError pb.err.log
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18090/_/ | Out-Null
                exit 0
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            Get-Content pb.log -ErrorAction SilentlyContinue
            Get-Content pb.err.log -ErrorAction SilentlyContinue
            exit 1
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketbase-mysql-${{ matrix.goos }}-${{ matrix.goarch }}
          path: pocketbase-mysql${{ matrix.binary_suffix }}
          if-no-files-found: error
