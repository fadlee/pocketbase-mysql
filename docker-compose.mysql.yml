services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pbpass
      MYSQL_DATABASE: pocketbase
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h127.0.0.1", "-uroot", "-ppbpass", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  pocketbase-mysql:
    build:
      context: .
    environment:
      PB_DATABASE_DRIVER: mysql
      PB_DATABASE_DSN: root:pbpass@tcp(mysql:3306)/pocketbase?parseTime=true&multiStatements=true
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8090:8090"
    volumes:
      - pocketbase-data:/pb_data

volumes:
  mysql-data:
  pocketbase-data:
